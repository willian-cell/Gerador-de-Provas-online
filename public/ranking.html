<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking Global - Gerador de Provas Online</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .rank-table-wrapper {
      background: var(--dark-700);
      border-radius: 1rem;
      overflow: hidden;
      border: 1px solid var(--dark-500);
    }
    .ranking-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    .ranking-table th {
      background: var(--dark-800);
      padding: 1rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--gray-400);
      letter-spacing: 0.05em;
    }
    .ranking-table td {
      padding: 1rem;
      border-bottom: 1px solid var(--dark-500);
      font-size: 0.9rem;
    }
    .ranking-table tr:last-child td { border: none; }
    .ranking-table tr:hover td { background: rgba(59,130,246,0.05); }
    
    .rank-num { font-weight: 800; color: var(--gray-400); }
    .rank-num.top { color: var(--blue-400); }
    
    .student-cell { display: flex; align-items: center; gap: 0.75rem; }
    .student-avatar {
      width: 32px; height: 32px; border-radius: 99px;
      background: var(--dark-500); display: flex; align-items: center;
      justify-content: center; font-weight: 700; font-size: 0.8rem;
    }
    
    .my-rank-card {
      display: flex; align-items: center; gap: 2rem;
      background: linear-gradient(135deg, var(--dark-700), var(--dark-800));
      padding: 1.5rem; border-radius: 1rem; margin-bottom: 1.5rem;
      border: 1px solid var(--blue-600); box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .rank-medal { font-size: 2.5rem; }
    .stat-label { font-size: 0.7rem; color: var(--gray-400); margin-top: 0.25rem; }
    .empty-ranking { text-align: center; padding: 4rem 2rem; color: var(--gray-400); }

    @media (max-width: 768px) {
      .my-rank-card { flex-direction: column; text-align: center; gap: 1rem; }
      .ranking-table th:nth-child(3), .ranking-table td:nth-child(3) { display: none; }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">🎓</div>
        <div class="logo-text"><strong>WBO Tecnologia</strong><span>Gerador de Provas</span></div>
      </div>
      <div class="sidebar-user" id="sidebarUser">
        <div class="user-avatar" id="avatarChar">?</div>
        <div class="user-info">
          <div class="user-name" id="sidebarName">...</div>
          <div class="user-cpf" id="sidebarCPF"></div>
        </div>
      </div>
      <div class="nav-label">Menu</div>
      <a href="/dashboard" class="nav-link">Dashboard</a>
      <a href="/profile" class="nav-link">Perfil</a>
      <a href="/ranking" class="nav-link active">Ranking</a>
      <a href="/review" class="nav-link">Revisão</a>
      <div class="sidebar-footer">
        <button onclick="location.href='/api/auth/logout'" class="btn btn-ghost btn-full">Sair</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <div>
          <h3 style="font-size:1.1rem;margin:0">🏆 Ranking Global</h3>
          <p style="font-size:0.8rem;color:var(--gray-400);margin:0">Os melhores estudantes do sistema (Acertos - Erros)</p>
        </div>
      </header>

      <div class="page-body">
        <div class="my-rank-card" id="myRankCard" style="display:none">
          <div class="rank-medal" id="myMedal">🏅</div>
          <div style="flex:1">
            <div style="font-size:0.8rem;color:var(--gray-400);margin-bottom:0.25rem">Sua posição no ranking</div>
            <div style="font-size:1.4rem;font-weight:800" id="myPosition">#—</div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.5rem;text-align:center">
            <div><div style="font-size:1.2rem;font-weight:700;color:var(--blue-400)" id="myAvg">—</div><div class="stat-label">Média Saldo</div></div>
            <div><div style="font-size:1.2rem;font-weight:700;color:var(--green-600)" id="myBest">—</div><div class="stat-label">Melhor Saldo</div></div>
            <div><div style="font-size:1.2rem;font-weight:700" id="myExams">—</div><div class="stat-label">Provas</div></div>
          </div>
        </div>

        <div class="rank-table-wrapper">
          <table class="ranking-table" id="rankingTable">
            <thead>
              <tr>
                <th style="width:60px">#</th>
                <th>Estudante</th>
                <th>CPF</th>
                <th>Provas</th>
                <th>Média Saldo</th>
                <th>Melhor</th>
              </tr>
            </thead>
            <tbody id="rankingBody">
              <tr><td colspan="6" class="empty-ranking">Carregando ranking...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    async function loadRanking() {
      try {
        const [userResp, rankingData] = await Promise.all([
          fetch('/api/auth/me').then(r => r.json()),
          fetch('/api/ranking').then(r => r.json())
        ]);

        if (userResp.success) {
          const user = userResp.user;
          document.getElementById('sidebarName').textContent = user.name;
          document.getElementById('sidebarCPF').textContent = user.cpf;
          document.getElementById('avatarChar').textContent = user.name[0];
          
          // Get my rank specifically
          const myPosResp = await fetch(`/api/ranking/user/` + user.id).then(r => r.json());
          if (myPosResp && myPosResp.stats) {
            document.getElementById('myRankCard').style.display = 'flex';
            document.getElementById('myPosition').textContent = '#' + myPosResp.position;
            document.getElementById('myAvg').textContent = myPosResp.stats.avg_score;
            document.getElementById('myBest').textContent = myPosResp.stats.best_score;
            document.getElementById('myExams').textContent = myPosResp.stats.total_exams;
            
            if (myPosResp.position === 1) document.getElementById('myMedal').textContent = '🥇';
            else if (myPosResp.position === 2) document.getElementById('myMedal').textContent = '🥈';
            else if (myPosResp.position === 3) document.getElementById('myMedal').textContent = '🥉';
          }
        }

        const tbody = document.getElementById('rankingBody');
        if (!rankingData || rankingData.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6"><div class="empty-ranking"><div style="font-size:3rem;margin-bottom:1rem">🏆</div><p>Nenhum resultado ainda. Faça sua primeira prova!</p></div></td></tr>`;
          return;
        }

        tbody.innerHTML = rankingData.map((r, i) => {
          let posDisplay = i + 1;
          if (i === 0) posDisplay = '🥇';
          else if (i === 1) posDisplay = '🥈';
          else if (i === 2) posDisplay = '🥉';

          return `
            <tr>
              <td class="rank-num ${i < 3 ? 'top' : ''}">${posDisplay}</td>
              <td>
                <div class="student-cell">
                  <div class="student-avatar">${r.name[0]}</div>
                  <div style="font-weight:600">${r.name}</div>
                </div>
              </td>
              <td style="font-family:monospace;color:var(--gray-400)">${r.cpf}</td>
              <td style="font-weight:700">${r.total_exams}</td>
              <td style="color:var(--blue-400);font-weight:700">${r.avg_score} pts</td>
              <td style="color:var(--green-600);font-weight:700">${r.best_score} pts</td>
            </tr>
          `;
        }).join('');

      } catch (err) {
        console.error(err);
      }
    }
    loadRanking();
  </script>
</body>
</html>
